[package]
name = "ucf-core-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The pilot's doctrine for embedding in device shells (UniFFI): one function, whiskerAdvise."

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "familiar_core"

[dependencies]
ucf-pilot.workspace = true
serde_json.workspace = true
uniffi = { version = "0.28" }

# `cli` is the binding GENERATOR, not the core. Left on by default it links the whole
# bindgen toolchain (clap, askama, goblin, weedle, cargo_metadata) into the staticlib
# the app carries — 29 MB a slice, for code no device ever calls. Gated here, the
# archive holds the doctrine and the UniFFI runtime and nothing else; tools/build-core.sh
# turns it on only for the `uniffi-bindgen` run that writes the Swift.
[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
