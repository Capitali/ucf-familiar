# XcodeGen spec for UCF Familiar — regenerate the project with `xcodegen`, so the
# .xcodeproj is never hand-maintained.
#
# One app and its test bundle. The app is the captain's bridge: it talks either
# straight to the exchange with the captain's key, or to the fleet feed a Mac
# serves (`ucf-familiar fleet serve`).
name: UCFFamiliar
options:
  bundleIdPrefix: io.river.familiar
  # The floor is 26 everywhere: on-device Apple Intelligence is a premise of the
  # bridge's voice, not a capability to detect around.
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8GHXL328AR
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    # Private Cloud Compute names a 27-SDK-only type, so the flag is defined
    # exactly where the type exists. A 26-SDK build compiles that lane out
    # honestly, since such a binary could never link the type anyway. Runtime
    # consent gating is untouched.
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27*]": "$(inherited) FAMILIAR_SDK_HAS_PCC"
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27*]": "$(inherited) FAMILIAR_SDK_HAS_PCC"
    # The core xcframework's simulator slice is arm64-only, so nothing in this
    # project can be an x86_64 simulator build. Set once at the project, not on the
    # app alone: the test bundle links the app, and when only the app excluded
    # x86_64 the test target still tried to build one and failed to resolve the
    # host's module at all ("unable to resolve module dependency: 'UCF_Familiar'"),
    # which silently cost us the pin on the checked-in archive.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  # The ship's computer: FamiliarSC (store, wire, voice) and FamiliarSCUI (the
  # bridge screens). No other package — this app depends on nothing else.
  FamiliarSC:
    path: FamiliarSC
targets:
  UCFFamiliar:
    type: application
    platform: iOS
    sources:
      - UCFFamiliar/Sources
      - UCFFamiliar/Assets.xcassets
      # The embeddable Rust core (tools/build-core.sh): the pilot's doctrine as
      # whiskerAdvise(inputJson:), so the same doctrine answers on the device
      # and on the host.
      - path: FamiliarCore/Generated/familiar_core.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.river.familiar.ucf
        PRODUCT_NAME: UCF Familiar
        INFOPLIST_FILE: UCFFamiliar/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: UCFFamiliar/Support/UCFFamiliar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "12"
    dependencies:
      - package: FamiliarSC
        product: FamiliarSCUI
      # Static library — link only, never embed.
      - framework: FamiliarCore/FamiliarCore.xcframework
        embed: false
    scheme:
      testTargets: [UCFFamiliarTests]
  # The pin on the CHECKED-IN core: the archive linked into the app is run on the
  # simulator over the same fixtures the Rust seam tests pin against current
  # source. Both suites green while the shipped runtime disagreed was the defect
  # this target exists to catch; it is the only thing that executes the archive.
  UCFFamiliarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UCFFamiliarTests
      - path: FamiliarSC/Tests/FamiliarSCTests/Fixtures/contract/seam-denied-repair.json
        buildPhase: resources
      - path: FamiliarSC/Tests/FamiliarSCTests/Fixtures/contract/seam-bay-full.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.river.familiar.ucf.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UCF Familiar.app/UCF Familiar"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: UCFFamiliar
